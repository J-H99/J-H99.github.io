<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>클라우드 스토리지 2시간 강연</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #f4f6f8;
      --ink: #16202c;
      --muted: #657281;
      --line: #d9e0e7;
      --panel: #ffffff;
      --panel-2: #e9eef3;
      --blue: #2f6df6;
      --green: #22a77a;
      --red: #e65f4d;
      --amber: #d39125;
      --purple: #7458f4;
      --dark: #111b26;
      --shadow: 0 18px 45px rgba(20, 31, 46, .08);
      --radius: 8px;
      --side: 360px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      letter-spacing: 0;
      overflow-x: hidden;
    }

    body {
      display: grid;
      grid-template-columns: var(--side) 1fr;
      animation: page-in .42s cubic-bezier(.16, 1, .3, 1) both;
    }

    button, input {
      font: inherit;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: #fbfcfe;
      padding: 26px 22px 32px;
      animation: sidebar-in .52s cubic-bezier(.16, 1, .3, 1) both;
    }

    .brand {
      display: grid;
      gap: 10px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .progress-wrap {
      margin-top: 18px;
      display: grid;
      gap: 8px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .progress {
      height: 8px;
      border: 1px solid var(--line);
      background: #e7edf3;
      overflow: hidden;
      border-radius: 999px;
    }

    .progress > span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--blue), var(--green));
      transition: width .22s ease;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      margin: 18px 0 16px;
    }

    .tool-btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      height: 38px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      min-width: 0;
      transition: border-color .18s ease, background .18s ease, box-shadow .22s cubic-bezier(.16, 1, .3, 1), transform .22s cubic-bezier(.16, 1, .3, 1);
    }

    .tool-btn:hover {
      border-color: #b8ad9b;
      background: white;
      box-shadow: 0 10px 18px rgba(20, 31, 46, .08);
      transform: translateY(-1px);
    }

    .category-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 0 0 18px;
    }

    .chip {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, color .18s ease, transform .2s cubic-bezier(.16, 1, .3, 1);
    }

    .chip:hover {
      transform: translateY(-1px);
    }

    .chip.active {
      background: var(--dark);
      color: white;
      border-color: var(--dark);
    }

    .category {
      margin: 16px 0 22px;
    }

    .category-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      padding: 0 4px 8px;
    }

    .tabs {
      display: grid;
      gap: 7px;
    }

    .tab {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      text-align: left;
      padding: 11px 12px;
      border-radius: 7px;
      cursor: pointer;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      color: var(--ink);
      white-space: normal;
      transition: border-color .18s ease, background .18s ease, box-shadow .22s cubic-bezier(.16, 1, .3, 1), color .18s ease, transform .22s cubic-bezier(.16, 1, .3, 1);
    }

    .tab:hover {
      background: #edf3f8;
      border-color: #d8e2ec;
      transform: translateX(2px);
    }

    .tab.active {
      background: var(--dark);
      color: white;
      border-color: var(--dark);
      box-shadow: 0 12px 26px rgba(17, 27, 38, .18);
      transform: translateX(3px);
    }

    .tab-no {
      color: var(--blue);
      font-size: 13px;
      font-weight: 900;
    }

    .tab.active .tab-no {
      color: #81b5ff;
    }

    .tab-title {
      min-width: 0;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.35;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .stage {
      min-width: 0;
      min-height: 100vh;
      padding: 34px clamp(28px, 4vw, 58px) 42px;
      animation: stage-in .58s cubic-bezier(.16, 1, .3, 1) both;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    .crumb {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 99px;
      background: var(--accent, var(--blue));
      display: inline-block;
    }

    .slide-nav {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 6px;
      height: 36px;
      min-width: 84px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 850;
      color: var(--ink);
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, box-shadow .22s cubic-bezier(.16, 1, .3, 1), transform .22s cubic-bezier(.16, 1, .3, 1);
    }

    .nav-btn:not(:disabled):hover {
      border-color: #bcc7d2;
      background: #fbfdff;
      box-shadow: 0 10px 22px rgba(20, 31, 46, .08);
      transform: translateY(-1px);
    }

    .nav-btn:disabled {
      cursor: default;
      opacity: .42;
    }

    .slide {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      aspect-ratio: 16 / 9;
      width: min(100%, 1920px, calc((100vh - 118px) * 16 / 9));
      min-height: 0;
      margin-inline: auto;
      border-radius: var(--radius);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .hero {
      border-top: 10px solid var(--accent, var(--blue));
      padding: clamp(28px, 4vw, 52px) clamp(28px, 4vw, 56px) 22px;
      background:
        linear-gradient(120deg, rgba(47, 109, 246, .08), transparent 45%),
        linear-gradient(270deg, rgba(34, 167, 122, .08), transparent 35%),
        var(--panel);
      animation: slide-head-in .38s cubic-bezier(.16, 1, .3, 1) both;
    }

    .hero-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .hero h2 {
      margin: 0;
      max-width: 1200px;
      font-size: clamp(34px, 4.3vw, 66px);
      line-height: 1.08;
      letter-spacing: -0.01em;
    }

    .claim {
      margin: 20px 0 0;
      max-width: 980px;
      color: var(--muted);
      font-size: clamp(18px, 1.7vw, 23px);
      line-height: 1.55;
      font-weight: 650;
    }

    .content {
      padding: 24px clamp(28px, 4vw, 56px) 42px;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(330px, .95fr);
      gap: clamp(22px, 3vw, 40px);
      align-items: start;
      animation: slide-body-in .44s cubic-bezier(.16, 1, .3, 1) 70ms both;
    }

    .text-stack {
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .section-title {
      font-size: 14px;
      color: var(--muted);
      font-weight: 950;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .point-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .point-list li {
      position: relative;
      padding: 14px 16px 14px 42px;
      border: 1px solid var(--line);
      background: #fbfdff;
      border-radius: 7px;
      line-height: 1.55;
      font-size: 17px;
      animation: point-in .34s cubic-bezier(.16, 1, .3, 1) both;
    }

    .point-list li:nth-child(2) { animation-delay: 45ms; }
    .point-list li:nth-child(3) { animation-delay: 90ms; }
    .point-list li:nth-child(4) { animation-delay: 135ms; }
    .point-list li:nth-child(5) { animation-delay: 180ms; }

    .point-list li::before {
      content: "";
      position: absolute;
      left: 17px;
      top: 22px;
      width: 9px;
      height: 9px;
      border-radius: 99px;
      background: var(--accent, var(--blue));
    }

    .field-note {
      border-left: 5px solid var(--accent, var(--blue));
      background: #eef4ff;
      padding: 16px 18px;
      color: #263546;
      border-radius: 4px;
      font-size: 16px;
      line-height: 1.55;
      font-weight: 720;
    }

    .visual {
      min-height: 360px;
      display: grid;
      align-self: start;
      align-content: start;
      gap: 16px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, #f3f7fb);
      border-radius: 8px;
      padding: 22px;
      overflow: hidden;
    }

    @media (min-width: 1800px) {
      :root { --side: 340px; }

      .stage {
        padding-left: clamp(42px, 3.4vw, 74px);
        padding-right: clamp(42px, 3.4vw, 74px);
      }

      .content {
        grid-template-columns: minmax(0, 1.15fr) minmax(500px, .85fr);
      }

      .visual {
        align-content: start;
      }
    }

    .visual-title {
      color: var(--muted);
      font-weight: 950;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .v-card {
      border: 1px solid var(--line);
      background: white;
      border-radius: 7px;
      padding: 15px;
      min-height: 98px;
    }

    .v-card strong {
      display: block;
      font-size: 18px;
      line-height: 1.25;
      margin-bottom: 8px;
      color: var(--card-accent, var(--ink));
    }

    .v-card span {
      display: block;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
      gap: 12px;
      align-items: center;
      counter-reset: flow-step;
    }

    .flow .step {
      min-width: 0;
      min-height: 112px;
      border: 1px solid var(--line);
      background: white;
      border-radius: 7px;
      padding: 16px;
      position: relative;
      counter-increment: flow-step;
    }

    .flow .step::before {
      content: counter(flow-step);
      position: absolute;
      top: 12px;
      right: 12px;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 99px;
      background: color-mix(in srgb, var(--card-accent, var(--blue)) 16%, white);
      color: var(--card-accent, var(--blue));
      font-size: 12px;
      font-weight: 950;
    }

    .flow .step strong {
      display: block;
      margin-bottom: 8px;
      font-size: 17px;
      color: var(--card-accent, var(--ink));
      overflow-wrap: anywhere;
    }

    .flow .step span {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      overflow: hidden;
      border-radius: 7px;
    }

    .table th {
      background: var(--dark);
      color: white;
      text-align: left;
      padding: 12px;
      font-size: 13px;
    }

    .table td {
      background: white;
      border: 1px solid var(--line);
      padding: 12px;
      color: var(--muted);
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .table td:first-child {
      color: var(--ink);
      font-weight: 850;
    }

    .matrix {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }

    .matrix .cell {
      border: 1px solid var(--line);
      background: white;
      min-height: 84px;
      border-radius: 7px;
      padding: 14px;
    }

    .matrix .cell strong {
      display: block;
      color: var(--card-accent, var(--ink));
      margin-bottom: 7px;
      font-size: 16px;
    }

    .matrix .cell span {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .timeline {
      display: grid;
      gap: 12px;
    }

    .time-item {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 14px;
      align-items: center;
    }

    .time-item b {
      color: var(--card-accent, var(--blue));
      font-size: 18px;
    }

    .time-item div {
      border: 1px solid var(--line);
      background: white;
      border-radius: 7px;
      padding: 13px 15px;
      color: var(--muted);
      line-height: 1.4;
    }

    .key-value {
      display: grid;
      gap: 10px;
    }

    .kv {
      display: grid;
      grid-template-columns: 145px 1fr;
      border: 1px solid var(--line);
      background: white;
      border-radius: 7px;
      overflow: hidden;
    }

    .kv b {
      padding: 12px;
      background: #edf3f8;
      color: var(--ink);
    }

    .kv span {
      padding: 12px;
      color: var(--muted);
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .source {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .source a {
      color: var(--blue);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    body.presentation-mode {
      display: block;
      min-height: 100vh;
      background: #111b26;
    }

    body.presentation-mode .sidebar,
    body.presentation-mode .topbar {
      display: none;
    }

    body.presentation-mode .stage {
      min-height: 100vh;
      padding: 0;
      display: grid;
      place-items: center;
    }

    body.presentation-mode .slide {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      min-height: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    body.presentation-mode .hero {
      padding: clamp(30px, 4.2vh, 58px) clamp(42px, 5.2vw, 82px) 20px;
    }

    body.presentation-mode .hero h2 {
      max-width: 1400px;
      font-size: clamp(44px, 4.5vw, 82px);
    }

    body.presentation-mode .claim {
      max-width: 1180px;
      font-size: clamp(21px, 1.6vw, 30px);
    }

    body.presentation-mode .content {
      padding: 22px clamp(42px, 5.2vw, 82px) clamp(34px, 4.2vh, 58px);
      gap: clamp(26px, 3.2vw, 54px);
      grid-template-columns: minmax(0, 1.05fr) minmax(380px, .95fr);
    }

    body.presentation-mode .point-list li {
      font-size: clamp(17px, 1.12vw, 22px);
    }

    body.presentation-mode .field-note {
      font-size: clamp(16px, 1vw, 20px);
    }

    body.presentation-mode .visual {
      min-height: 0;
      padding: clamp(20px, 1.7vw, 30px);
    }

    body.presentation-mode .source {
      font-size: 13px;
    }

    .cover-mode .slide {
      background: var(--dark);
      color: white;
      border-color: #233344;
    }

    .cover-mode .hero {
      background:
        radial-gradient(circle at 80% 18%, rgba(127, 179, 255, .24), transparent 24%),
        radial-gradient(circle at 76% 70%, rgba(34, 167, 122, .16), transparent 26%),
        var(--dark);
    }

    .cover-mode .claim,
    .cover-mode .hero-meta,
    .cover-mode .source,
    .cover-mode .visual-title {
      color: #aebdca;
    }

    .cover-mode .content,
    .cover-mode .visual {
      background: #142232;
      border-color: #2c4053;
    }

    .cover-mode .point-list li,
    .cover-mode .v-card {
      background: #182a3d;
      border-color: #2c4053;
      color: white;
    }

    .cover-mode .v-card span,
    .cover-mode .point-list li {
      color: #c5d0dc;
    }

    .footer-links {
      margin-top: 26px;
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .footer-links a {
      color: var(--muted);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    @keyframes page-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes sidebar-in {
      from {
        opacity: 0;
        transform: translateX(-14px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes stage-in {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slide-head-in {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slide-body-in {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes point-in {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }

    @media (max-width: 1100px) {
      :root { --side: 310px; }
      .content { grid-template-columns: 1fr; }
      .visual { min-height: 300px; }
      .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 820px) {
      body {
        display: block;
      }

      .sidebar {
        position: relative;
        height: auto;
        max-height: none;
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .brand,
      .progress-wrap,
      .toolbar,
      .category-filter,
      .category,
      .tabs,
      .tab,
      .tab-title {
        min-width: 0;
        max-width: 100%;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .category-filter {
        flex-wrap: wrap;
        overflow-x: visible;
      }

      .chip {
        flex: 0 1 auto;
        max-width: 100%;
      }

      .tab-title {
        display: block;
        inline-size: 100%;
        white-space: normal !important;
        word-break: break-all;
        overflow-wrap: anywhere;
        line-break: anywhere;
      }

      .tab {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        width: 100%;
        max-width: 100%;
        min-width: 0;
        white-space: normal;
        line-height: 1.35;
      }

      .tab .tab-no {
        width: 34px;
      }

      .tab .tab-title {
        min-width: 0;
        max-width: 100%;
        white-space: normal !important;
        word-break: break-all;
        overflow-wrap: anywhere;
      }

      .tabs {
        grid-template-columns: 1fr;
      }

      .stage {
        padding: 20px 14px 30px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero h2 {
        font-size: 34px;
      }

      .slide {
        min-height: auto;
      }

      .card-grid, .matrix {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      body {
        display: block;
        background: white;
      }

      .sidebar,
      .topbar {
        display: none;
      }

      .stage {
        padding: 0;
      }

      .slide {
        display: block;
        min-height: 0;
        border: 0;
        box-shadow: none;
        page-break-after: always;
      }

      .content {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
    }

          "무한 보관은 비용과 개인정보 리스크를 키우므로 retention 정책이 설계의 일부입니다."
        ],
        field: "로그 레이크의 성패는 저장 용량보다 partition, compression, retention, schema에서 갈립니다.",
        visual: { type: "flow", title: "Log lake", items: [
          ["App servers", "stdout / log agent"],
          ["Buffer", "stream / queue"],
          ["Object storage", "raw partition"],
          ["Catalog + query", "Parquet, SQL"]
        ]},
        source: "Author synthesis using object storage and data lake practices"
      },
      {
        no: 29, cat: "practice", minutes: 4,
        title: "미니 설계 과제: 하루 1TB 사진 서비스를 설계해 보자",
        claim: "정답보다 trade-off를 설명하는 능력을 보는 설계 토론입니다.",
        points: [
          "3-4명씩 5분 논의하고, 선택한 구조 하나와 포기한 것 하나를 말합니다.",
          "업로드 경로, key 규칙, storage class, 보안 경계, 후처리, 삭제 정책을 정합니다.",
          "장애 복구, 비용 항목, CDN 캐시, 검증 전 공개 방지까지 포함합니다."
        ],
        field: "좋은 답안은 완벽한 그림이 아니라 선택과 포기를 말할 수 있는 그림입니다.",
        visual: { type: "matrix", title: "Workshop canvas", items: [
          ["Workload", "하루 1TB, 피크 10배"],
          ["Upload", "직접 업로드, multipart"],
          ["Keys", "tenant/date/hash prefix"],
          ["Security", "scan 전 private"],
          ["Cost", "원본/썸네일 보관 기간"],
          ["Recovery", "versioning, RPO/RTO"]
        ]},
        source: "Workshop prompt"
      },
      {
        no: 30, cat: "practice", minutes: 4,
        title: "현업에서는 이 10가지만 물어도 설계 품질이 크게 올라간다",
        claim: "벤더별 화면보다 중요한 것은 반복 가능한 질문입니다.",
        points: [
          "데이터 단위는 block/file/object 중 무엇인가?",
          "key와 metadata가 운영 기준을 담는가?",
          "기본 비공개와 최소 권한이 보장되는가?",
          "직접 업로드와 multipart가 필요한가?",
          "storage class, lifecycle, RPO/RTO, 비용 항목, 이벤트 idempotency를 설명할 수 있는가?"
        ],
        field: "강의의 최종 산출물은 특정 클라우드 암기가 아니라 설계 질문 목록입니다.",
        visual: { type: "cards", title: "Production checklist", items: [
          ["Access", "private by default, least privilege"],
          ["Lifecycle", "tier, delete, version cleanup"],
          ["Events", "idempotency, retry, queue"],
          ["Cost", "capacity, request, egress, retrieval"],
          ["Recovery", "RPO/RTO, restore rehearsal"],
          ["Observability", "exposure, errors, lag, anomaly"]
        ]},
        source: "Official docs listed in speaker notes",
        links: ["aws", "azureTier", "gcs"]
      }
    ];

    const categoryById = Object.fromEntries(categories.map((cat) => [cat.id, cat]));
    let activeIndex = 0;
    let activeFilter = "all";

    const tabGroups = document.querySelector("#tabGroups");
    const categoryFilter = document.querySelector("#categoryFilter");
    const slideEl = document.querySelector("#slide");
    const categoryName = document.querySelector("#categoryName");
    const slideCount = document.querySelector("#slideCount");
    const progressLabel = document.querySelector("#progressLabel");
    const timeLabel = document.querySelector("#timeLabel");
    const progressBar = document.querySelector("#progressBar");
    const prevBtn = document.querySelector("#prevBtn");
    const nextBtn = document.querySelector("#nextBtn");
    const fullscreenBtn = document.querySelector("#fullscreenBtn");
    const forcedPresentationMode = new URLSearchParams(location.search).get("present") === "1";
    document.body.classList.toggle("presentation-mode", forcedPresentationMode);

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function renderFilters() {
      const filters = [{ id: "all", label: "전체" }, ...categories];
      categoryFilter.innerHTML = filters.map((cat) => (
        `<button class="chip ${cat.id === activeFilter ? "active" : ""}" type="button" data-filter="${cat.id}">${escapeHtml(cat.label)}</button>`
      )).join("");
    }

    function renderTabs() {
      tabGroups.innerHTML = categories.map((cat) => {
        const groupSlides = slides.filter((slide) => slide.cat === cat.id);
        const hidden = activeFilter !== "all" && activeFilter !== cat.id;
        return `
          <section class="category" ${hidden ? "hidden" : ""}>
            <div class="category-head"><span>${escapeHtml(cat.label)}</span><span>${escapeHtml(cat.range)}</span></div>
            <div class="tabs">
              ${groupSlides.map((slide) => `
                <button class="tab ${slides[activeIndex].no === slide.no ? "active" : ""}" type="button" data-slide="${slide.no}">
                  <span class="tab-no">${String(slide.no).padStart(2, "0")}</span>
                  <span class="tab-title">${escapeHtml(slide.title)}</span>
                </button>
              `).join("")}
            </div>
          </section>
        `;
      }).join("");
    }

    function visibleSlides() {
      return activeFilter === "all" ? slides : slides.filter((slide) => slide.cat === activeFilter);
    }

    function linkSource(key) {
      const url = sourceLinks[key];
      return url ? `<a href="${url}" target="_blank" rel="noreferrer">${escapeHtml(new URL(url).hostname.replace("www.", ""))}</a>` : "";
    }

    function renderVisual(visual) {
      if (!visual) return "";
      const title = `<div class="visual-title">${escapeHtml(visual.title || "Visual")}</div>`;
      if (visual.type === "flow") {
        return title + `<div class="flow" style="--cols:${Math.min(visual.items.length, 4)}">${visual.items.map((item, i) => `
          <div class="step" style="--card-accent:${["#2f6df6", "#22a77a", "#d39125", "#e65f4d", "#7458f4"][i % 5]}">
            <strong>${escapeHtml(item[0])}</strong>
            <span>${escapeHtml(item[1])}</span>
          </div>
        `).join("")}</div>`;
      }

      if (visual.type === "table") {
        return title + `<table class="table">
          <thead><tr>${visual.headers.map((h) => `<th>${escapeHtml(h)}</th>`).join("")}</tr></thead>
          <tbody>${visual.rows.map((row) => `<tr>${row.map((cell) => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>`;
      }

      if (visual.type === "matrix") {
        return title + `<div class="matrix">${visual.items.map((item, i) => `
          <div class="cell" style="--card-accent:${["#2f6df6", "#22a77a", "#d39125", "#e65f4d", "#7458f4"][i % 5]}">
            <strong>${escapeHtml(item[0])}</strong>
            <span>${escapeHtml(item[1])}</span>
          </div>
        `).join("")}</div>`;
      }

      if (visual.type === "timeline") {
        return title + `<div class="timeline">${visual.items.map((item, i) => `
          <div class="time-item" style="--card-accent:${["#2f6df6", "#22a77a", "#d39125", "#e65f4d", "#7458f4"][i % 5]}">
            <b>${escapeHtml(item[0])}</b>
            <div>${escapeHtml(item[1])}</div>
          </div>
        `).join("")}</div>`;
      }

      if (visual.type === "kv") {
        return title + `<div class="key-value">${visual.items.map((item) => `
          <div class="kv"><b>${escapeHtml(item[0])}</b><span>${escapeHtml(item[1])}</span></div>
        `).join("")}</div>`;
      }

      return title + `<div class="card-grid">${visual.items.map((item, i) => `
        <div class="v-card" style="--card-accent:${["#2f6df6", "#22a77a", "#d39125", "#e65f4d", "#7458f4", "#0f8f6e"][i % 6]}">
          <strong>${escapeHtml(item[0])}</strong>
          <span>${escapeHtml(item[1])}</span>
        </div>
      `).join("")}</div>`;
    }

    function renderSlide(options = {}) {
      const slide = slides[activeIndex];
      const cat = categoryById[slide.cat];
      const visible = visibleSlides();
      const navIndex = visible.findIndex((item) => item.no === slide.no);
      document.documentElement.style.setProperty("--accent", cat.accent);
      document.body.classList.toggle("cover-mode", slide.no === 1 || slide.no === 30);

      categoryName.textContent = cat.label;
      slideCount.textContent = `${String(slide.no).padStart(2, "0")} / 30`;
      progressLabel.textContent = `${String(slide.no).padStart(2, "0")} / 30`;
      timeLabel.textContent = `${slide.minutes}분`;
      progressBar.style.width = `${(slide.no / slides.length) * 100}%`;
      prevBtn.disabled = navIndex <= 0;
      nextBtn.disabled = navIndex < 0 || navIndex >= visible.length - 1;

      const links = (slide.links || []).map(linkSource).filter(Boolean);
      slideEl.innerHTML = `
        <header class="hero">
          <div class="hero-meta"><span class="dot"></span><span>${escapeHtml(cat.label)}</span><span>${slide.minutes}분</span></div>
          <h2>${escapeHtml(slide.title)}</h2>
          <p class="claim">${escapeHtml(slide.claim)}</p>
        </header>
        <div class="content">
          <div class="text-stack">
            <section>
              <div class="section-title">Lecture points</div>
              <ul class="point-list">
                ${slide.points.map((point) => `<li>${escapeHtml(point)}</li>`).join("")}
              </ul>
            </section>
            <div class="field-note">${escapeHtml(slide.field)}</div>
            <div class="source">출처/근거: ${escapeHtml(slide.source)}${links.length ? " · " + links.join(" · ") : ""}</div>
          </div>
          <aside class="visual">
            ${renderVisual(slide.visual)}
          </aside>
        </div>
      `;
      renderTabs();
      if (options.updateHash !== false) {
        history.replaceState(null, "", `${location.href.split("#")[0]}#${String(slide.no).padStart(2, "0")}`);
      }
    }

    function goToSlide(no) {
      const index = slides.findIndex((slide) => slide.no === Number(no));
      if (index < 0) return;
      if (activeFilter !== "all" && slides[index].cat !== activeFilter) {
        activeFilter = "all";
        renderFilters();
      }
      activeIndex = index;
      renderSlide();
    }

    function moveSlide(delta) {
      const visible = visibleSlides();
      const currentVisibleIndex = visible.findIndex((slide) => slide.no === slides[activeIndex].no);
      const nextSlide = visible[currentVisibleIndex + delta];
      if (!nextSlide) return;
      activeIndex = slides.findIndex((slide) => slide.no === nextSlide.no);
      renderSlide();
    }

    function readHashNo() {
      const hashNo = Number(location.hash.replace("#", ""));
      return hashNo >= 1 && hashNo <= slides.length ? hashNo : null;
    }

    function syncSlideFromHash() {
      const hashNo = readHashNo();
      if (!hashNo) return;
      const nextIndex = hashNo - 1;
      if (nextIndex === activeIndex) return;
      activeIndex = nextIndex;
      if (activeFilter !== "all" && slides[activeIndex].cat !== activeFilter) {
        activeFilter = "all";
        renderFilters();
      }
      renderSlide({ updateHash: false });
    }

    function syncPresentationMode() {
      const enabled = forcedPresentationMode || Boolean(document.fullscreenElement);
      document.body.classList.toggle("presentation-mode", enabled);
      fullscreenBtn.textContent = document.fullscreenElement ? "나가기" : "전체화면";
    }

    categoryFilter.addEventListener("click", (event) => {
      const button = event.target.closest("[data-filter]");
      if (!button) return;
      activeFilter = button.dataset.filter;
      if (activeFilter !== "all") {
        const firstIndex = slides.findIndex((slide) => slide.cat === activeFilter);
        if (firstIndex >= 0) activeIndex = firstIndex;
      }
      renderFilters();
      renderSlide();
    });

    tabGroups.addEventListener("click", (event) => {
      const button = event.target.closest("[data-slide]");
      if (!button) return;
      goToSlide(button.dataset.slide);
    });

    prevBtn.addEventListener("click", () => {
      moveSlide(-1);
    });

    nextBtn.addEventListener("click", () => {
      moveSlide(1);
    });

    document.querySelector("#printBtn").addEventListener("click", () => window.print());
    fullscreenBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.body.classList.add("presentation-mode");
        document.documentElement.requestFullscreen?.().catch(() => syncPresentationMode());
      } else {
        document.exitFullscreen?.();
      }
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === "PageDown") nextBtn.click();
      if (event.key === "ArrowLeft" || event.key === "PageUp") prevBtn.click();
    });

    window.addEventListener("hashchange", syncSlideFromHash);
    document.addEventListener("fullscreenchange", syncPresentationMode);

    const hashNo = readHashNo();
    if (hashNo) {
      activeIndex = hashNo - 1;
    }

    renderFilters();
    syncPresentationMode();
    renderSlide();
  </script>
</body>
</html>
