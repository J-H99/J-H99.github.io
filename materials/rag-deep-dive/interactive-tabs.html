<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG Deep Dive Interactive Tabs</title>
    <style>
      :root {
        --bg: #fff8ea;
        --ink: #211a14;
        --muted: #665e52;
        --line: #2b2116;
        --line-soft: #d6cdbc;
        --panel: #fffef8;
        --panel-2: #fff7dc;
        --surface-soft: #fffaf0;
        --notes-bg: #dff5ed;
        --notes-label: #275f54;
        --accent: #2f6df6;
        --deep-dot: #efcf73;
        --notes-dot: #78d6bd;
        --dark: #2b2116;
        --shadow: 8px 8px 0 rgb(43 33 22 / 10%);
        --shadow-strong: 10px 10px 0 rgb(43 33 22 / 14%);
        --radius: 8px;
        --side: 360px;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          linear-gradient(90deg, rgb(49 38 25 / 7%) 1px, transparent 1px),
          linear-gradient(180deg, rgb(49 38 25 / 7%) 1px, transparent 1px), var(--bg);
        background-size: 88px 88px;
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Apple SD Gothic Neo",
          "Noto Sans KR",
          "Segoe UI",
          sans-serif;
        line-height: 1.6;
        letter-spacing: 0;
        word-break: keep-all;
        overflow-wrap: break-word;
        overflow-x: hidden;
      }

      body {
        display: grid;
        grid-template-columns: var(--side) 1fr;
      }

      button,
      input {
        font: inherit;
      }

      a {
        color: inherit;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        border-right: 2px solid rgb(43 33 22 / 18%);
        background: rgb(255 248 234 / 94%);
        backdrop-filter: blur(10px);
        padding: 26px 22px 32px;
      }

      .brand {
        display: grid;
        gap: 10px;
        padding-bottom: 20px;
        border-bottom: 2px solid rgb(43 33 22 / 14%);
      }

      .brand h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
      }

      .brand p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .progress-wrap {
        display: grid;
        gap: 8px;
        margin-top: 18px;
      }

      .progress-meta {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
      }

      .progress {
        display: block;
        width: 100%;
        height: 11px;
        overflow: hidden;
        appearance: none;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: var(--surface-soft);
      }

      .progress::-webkit-progress-bar {
        background: var(--surface-soft);
      }

      .progress::-webkit-progress-value {
        height: 100%;
        background: linear-gradient(90deg, var(--notes-dot), var(--deep-dot));
        transition: width 0.22s ease;
      }

      .progress::-moz-progress-bar {
        background: linear-gradient(90deg, var(--notes-dot), var(--deep-dot));
      }

      .toolbar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 18px 0 16px;
      }

      .tool-btn {
        border: 2px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        min-height: 40px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 950;
        cursor: pointer;
        min-width: 0;
        text-decoration: none;
        display: grid;
        place-items: center;
        box-shadow: 4px 4px 0 rgb(43 33 22 / 10%);
        transition:
          transform 180ms var(--ease-out),
          box-shadow 180ms ease,
          background 180ms ease;
      }

      .category-filter {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin: 0 0 18px;
      }

      .chip {
        border: 1px solid #c9c1b2;
        background: var(--panel);
        color: var(--muted);
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 950;
        cursor: pointer;
      }

      .chip.active {
        border-color: var(--dark);
        background: var(--dark);
        color: white;
      }

      .tool-btn:hover {
        background: var(--surface-soft);
        box-shadow: 6px 6px 0 rgb(43 33 22 / 12%);
        transform: translate(-1px, -1px);
      }

      .category {
        margin: 16px 0 22px;
      }

      .category-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 0 4px 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .tabs {
        display: grid;
        gap: 7px;
      }

      .tab {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        width: 100%;
        padding: 11px 12px;
        border: 2px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        text-align: left;
        white-space: normal;
      }

      .tab:hover {
        border-color: rgb(43 33 22 / 16%);
        background: var(--surface-soft);
      }

      .tab.active {
        border-color: var(--dark);
        background: var(--dark);
        color: white;
        box-shadow: 5px 5px 0 rgb(43 33 22 / 16%);
      }

      .tab-no {
        color: var(--notes-label);
        font-size: 13px;
        font-weight: 900;
      }

      .tab.active .tab-no {
        color: var(--notes-dot);
      }

      .tab-title {
        min-width: 0;
        font-size: 13px;
        font-weight: 800;
        line-height: 1.35;
        overflow-wrap: anywhere;
        word-break: keep-all;
      }

      .stage {
        min-width: 0;
        min-height: 100vh;
        padding: 34px clamp(28px, 4vw, 58px) 42px;
      }

      .viewer-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 22px;
      }

      .crumb {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 99px;
        background: var(--accent);
      }

      .slide-nav {
        display: flex;
        gap: 8px;
      }

      .nav-btn {
        border: 1px solid #c9c1b2;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        min-width: 80px;
        min-height: 40px;
        padding: 0 12px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 950;
      }

      .nav-btn:not(:disabled):hover {
        border-color: var(--line);
        background: var(--surface-soft);
      }

      .nav-btn:disabled {
        cursor: default;
        opacity: 0.45;
      }

      .slide {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        overflow: hidden;
        border: 2px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow: var(--shadow);
        aspect-ratio: 16 / 9;
        width: min(100%, 1920px, calc((100vh - 118px) * 16 / 9));
        min-height: 0;
        margin-inline: auto;
      }

      .slide.scroll-safe {
        overflow: auto;
      }

      .slide.scroll-safe .content,
      .slide.scroll-safe .visual {
        overflow: visible;
      }

      .hero {
        padding: clamp(28px, 4vw, 52px) clamp(28px, 4vw, 56px) 22px;
        border-top: 10px solid var(--accent, var(--deep-dot));
        border-bottom: 2px solid var(--line);
        background:
          linear-gradient(120deg, rgb(120 214 189 / 16%), transparent 44%),
          linear-gradient(270deg, rgb(239 207 115 / 22%), transparent 36%), var(--panel);
      }

      .hero-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-bottom: 18px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
      }

      .hero h2 {
        max-width: 1200px;
        margin: 0;
        font-size: clamp(34px, 4.3vw, 66px);
        line-height: 1.08;
        overflow-wrap: anywhere;
        word-break: keep-all;
      }

      .claim {
        max-width: 980px;
        margin: 20px 0 0;
        color: var(--muted);
        font-size: clamp(17px, 1.7vw, 23px);
        line-height: 1.55;
        font-weight: 650;
      }

      .content {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
        gap: clamp(22px, 3vw, 40px);
        align-items: start;
        min-height: 0;
        overflow: hidden;
        padding: 24px clamp(28px, 4vw, 56px) 42px;
      }

      .text-stack {
        display: grid;
        align-content: start;
        gap: 18px;
        min-width: 0;
        min-height: 0;
      }

      .section-title {
        margin-bottom: 9px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 950;
        text-transform: uppercase;
      }

      .point-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .point-list li {
        position: relative;
        padding: 14px 16px 14px 42px;
        border: 1px solid var(--line-soft);
        border-radius: 7px;
        background: var(--surface-soft);
        font-size: 17px;
        line-height: 1.55;
      }

      .point-list li::before {
        position: absolute;
        top: 22px;
        left: 17px;
        width: 9px;
        height: 9px;
        border-radius: 99px;
        background: var(--accent);
        content: "";
      }

      .field-note {
        padding: 16px 18px;
        border: 2px solid var(--line);
        border-left: 8px solid var(--accent);
        border-radius: 7px;
        background: var(--notes-bg);
        color: var(--ink);
        font-size: 16px;
        font-weight: 720;
        line-height: 1.58;
      }

      .field-label {
        display: block;
        margin-bottom: 6px;
        color: var(--notes-label);
        font-size: 12px;
        font-weight: 950;
        text-transform: uppercase;
      }

      .source {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        line-height: 1.5;
      }

      .source a {
        color: var(--notes-label);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
        overflow-wrap: anywhere;
      }

      .visual {
        display: grid;
        align-content: start;
        gap: 16px;
        min-height: 360px;
        min-width: 0;
        padding: 22px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: linear-gradient(180deg, var(--panel), var(--surface-soft));
        overflow: hidden;
      }

      .visual-title {
        color: var(--muted);
        font-size: 13px;
        font-weight: 950;
        text-transform: uppercase;
      }

      .flow,
      .cards,
      .matrix,
      .checklist {
        display: grid;
        gap: 12px;
      }

      .flow {
        grid-template-columns: repeat(auto-fit, minmax(124px, 1fr));
        counter-reset: flow-step;
      }

      .flow-card,
      .visual-card,
      .matrix-cell,
      .check-item {
        min-width: 0;
        border: 1px solid var(--line-soft);
        border-radius: 7px;
        background: var(--panel);
      }

      .flow-card {
        position: relative;
        min-height: 112px;
        padding: 16px 48px 16px 16px;
        counter-increment: flow-step;
      }

      .flow-card::before {
        position: absolute;
        top: 12px;
        right: 12px;
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        border-radius: 99px;
        background: color-mix(in srgb, var(--card-accent, var(--deep-dot)) 16%, var(--panel));
        color: var(--card-accent, var(--notes-label));
        content: counter(flow-step);
        font-size: 12px;
        font-weight: 950;
      }

      .cards,
      .matrix {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .visual-card,
      .matrix-cell,
      .check-item {
        padding: 14px;
      }

      .flow-card strong,
      .visual-card strong,
      .matrix-cell strong {
        display: block;
        margin-bottom: 8px;
        color: var(--card-accent, var(--ink));
        font-size: 17px;
        line-height: 1.25;
      }

      .flow-card span,
      .visual-card span,
      .matrix-cell span {
        display: block;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.45;
      }

      .visual-table-wrap {
        overflow-x: auto;
        border: 1px solid var(--line-soft);
        border-radius: 7px;
        background: var(--panel);
      }

      .visual-table {
        width: 100%;
        min-width: 520px;
        border-collapse: collapse;
      }

      .visual-table th,
      .visual-table td {
        padding: 10px 11px;
        border-bottom: 1px solid var(--line-soft);
        border-right: 1px solid var(--line-soft);
        text-align: left;
        vertical-align: top;
      }

      .visual-table th {
        background: var(--dark);
        color: white;
        font-size: 12px;
      }

      .visual-table td {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }

      .visual-table td:first-child {
        color: var(--ink);
        font-weight: 850;
      }

      .visual-table tr:last-child td {
        border-bottom: 0;
      }

      .visual-table th:last-child,
      .visual-table td:last-child {
        border-right: 0;
      }

      .check-item {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        color: var(--muted);
        font-size: 14px;
        font-weight: 750;
        line-height: 1.45;
      }

      .check-item::before {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border-radius: 50%;
        background: color-mix(in srgb, var(--accent) 15%, white);
        color: var(--accent);
        content: "✓";
        font-size: 13px;
        font-weight: 950;
      }

      .code-block {
        overflow-x: auto;
        margin: 0;
        padding: 16px;
        border-radius: 7px;
        background: #141c26;
        color: #e6edf5;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        line-height: 1.55;
        white-space: pre;
      }

      .slide.dense .hero {
        padding-top: clamp(18px, 2.4vw, 30px);
        padding-bottom: 12px;
      }

      .slide.dense .hero-meta {
        margin-bottom: 12px;
      }

      .slide.long-title .hero h2,
      .slide.dense .hero h2 {
        font-size: clamp(28px, 3vw, 46px);
        line-height: 1.05;
      }

      .slide.dense .claim {
        margin-top: 10px;
        font-size: clamp(15px, 1.15vw, 18px);
        line-height: 1.34;
      }

      .slide.dense .content {
        padding-top: 14px;
        padding-bottom: 20px;
        gap: clamp(16px, 2.2vw, 28px);
      }

      .slide.dense .text-stack {
        gap: 12px;
      }

      .slide.dense .point-list {
        gap: 7px;
      }

      .slide.dense .point-list li {
        padding: 10px 13px 10px 34px;
        font-size: 14.5px;
        line-height: 1.38;
      }

      .slide.dense .point-list li::before {
        left: 14px;
        top: 18px;
        width: 7px;
        height: 7px;
      }

      .slide.dense .field-note {
        padding: 11px 14px;
        font-size: 14px;
        line-height: 1.38;
      }

      .slide.dense .visual {
        min-height: 0;
        padding: 14px;
        gap: 8px;
      }

      .slide.dense .flow-card,
      .slide.dense .visual-card,
      .slide.dense .matrix-cell,
      .slide.dense .check-item {
        min-height: 0;
        padding: 9px 11px;
      }

      .slide.dense .flow-card {
        padding-right: 38px;
      }

      .slide.dense .flow-card strong,
      .slide.dense .visual-card strong,
      .slide.dense .matrix-cell strong {
        margin-bottom: 4px;
        font-size: 14px;
      }

      .slide.dense .flow-card span,
      .slide.dense .visual-card span,
      .slide.dense .matrix-cell span,
      .slide.dense .check-item {
        font-size: 12.8px;
        line-height: 1.32;
      }

      .slide.overfull .hero {
        padding-top: 18px;
        padding-bottom: 12px;
      }

      .slide.overfull .hero h2 {
        font-size: clamp(26px, 2.9vw, 46px);
      }

      .slide.overfull .claim {
        margin-top: 8px;
        font-size: clamp(14px, 1.1vw, 17px);
        line-height: 1.32;
      }

      .slide.overfull .content {
        padding-top: 12px;
        padding-bottom: 10px;
        gap: 16px;
      }

      .slide.overfull .text-stack {
        gap: 8px;
      }

      .slide.overfull .section-title {
        margin-bottom: 5px;
        font-size: 11.5px;
      }

      .slide.overfull .point-list li {
        padding-top: 8px;
        padding-bottom: 8px;
        font-size: 13px;
        line-height: 1.28;
      }

      .slide.overfull .field-note {
        padding: 8px 12px;
        font-size: 12.5px;
        line-height: 1.28;
      }

      .slide.overfull .source {
        font-size: 10.5px;
        line-height: 1.2;
      }

      .slide.overfull .code-block {
        padding: 12px;
        font-size: 11px;
        line-height: 1.35;
      }

      body.presentation-mode {
        display: block;
        min-height: 100vh;
        background: #111b26;
      }

      body.presentation-mode .sidebar,
      body.presentation-mode .viewer-topbar {
        display: none;
      }

      body.presentation-mode .stage {
        min-height: 100vh;
        padding: 0;
        display: grid;
        place-items: center;
      }

      body.presentation-mode .slide {
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        min-height: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .cover-mode .slide {
        background: var(--dark);
        color: white;
        border-color: var(--dark);
      }

      .cover-mode .hero {
        background:
          radial-gradient(circle at 80% 18%, rgb(120 214 189 / 24%), transparent 24%),
          radial-gradient(circle at 76% 70%, rgb(239 207 115 / 16%), transparent 26%), var(--dark);
      }

      .cover-mode .claim,
      .cover-mode .hero-meta,
      .cover-mode .source,
      .cover-mode .visual-title {
        color: #aebdca;
      }

      .cover-mode .content,
      .cover-mode .visual {
        background: #30261b;
        border-color: #5a4b38;
      }

      .cover-mode .point-list li {
        background: #3a2d20;
        border-color: #5a4b38;
        color: #c5d0dc;
      }

      .cover-mode .field-note {
        background: #3a2d20;
        border-color: #5a4b38;
        border-left-color: var(--accent);
        color: white;
      }

      .cover-mode .field-label {
        color: var(--notes-dot);
      }

      .footer-links {
        margin-top: 26px;
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .footer-links a {
        color: var(--muted);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      @media (width <= 1100px) {
        :root {
          --side: 310px;
        }

        body {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
          height: auto;
          max-height: 46vh;
          border-right: 0;
          border-bottom: 2px solid var(--line);
        }

        .stage {
          min-height: 0;
          padding-top: 24px;
        }

        .content {
          grid-template-columns: 1fr;
        }
      }

      @media (width <= 820px) {
        body {
          display: block;
        }

        .sidebar {
          position: sticky;
          top: 0;
          z-index: 20;
          height: auto;
          max-height: min(360px, 48vh);
          width: 100%;
          max-width: 100%;
          overflow: auto;
          border-right: 0;
          border-bottom: 2px solid rgb(43 33 22 / 18%);
          box-shadow: 0 12px 0 rgb(43 33 22 / 8%);
          padding: 20px 22px 18px;
        }

        .toolbar {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .stage {
          padding: 14px 14px 30px;
        }

        .hero,
        .content {
          padding-left: 18px;
          padding-right: 18px;
        }

        .hero h2 {
          font-size: 34px;
        }

        .slide,
        .slide.scroll-safe {
          aspect-ratio: auto;
          display: block;
          min-height: 0;
          overflow: hidden;
          width: 100%;
        }

        .content {
          display: grid;
          grid-template-columns: 1fr;
          overflow: visible;
          padding: 18px 18px 24px;
        }

        .visual {
          min-height: 0;
        }

        .flow,
        .cards,
        .matrix {
          grid-template-columns: 1fr;
        }

        .viewer-topbar {
          align-items: flex-start;
          flex-direction: column;
        }
      }

      @media print {
        body {
          display: block;
          background: white;
        }

        .sidebar,
        .viewer-topbar {
          display: none;
        }

        .stage {
          padding: 0;
        }

        .slide {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">

      function escapeHtml(value) {
        return String(value).replace(
          /[&<>"']/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;"
            })[char]
        );
      }

      function visibleSlides() {

      function sourceLink(key) {

        return `<a href="${escapeHtml(url)}" target="_blank" rel="noreferrer">${escapeHtml(host)}</a>`;

          .join("");

            return `

        progressBar.max = slides.length;
        progressBar.textContent = `${slide.no} / ${slides.length}`;
        timeLabel.textContent = `${slide.minutes}분`;
        prevBtn.disabled = navIndex <= 0;
        nextBtn.disabled = navIndex < 0 || navIndex >= visible.length - 1;

        const links = (slide.links || []).map(sourceLink).filter(Boolean);
        slideEl.innerHTML = `
          <header class="hero">
            <div class="hero-meta"><span class="dot" aria-hidden="true"></span><span>${escapeHtml(cat.label)}</span><span>${slide.minutes}분</span></div>
            <h2>${escapeHtml(slide.title)}</h2>
            <p class="claim">${escapeHtml(slide.claim)}</p>
          </header>
          <div class="content">
            <div class="text-stack">
              <section>
                <div class="section-title">핵심 내용</div>
                <ul class="point-list">
                  ${slide.points.map((point) => `<li>${escapeHtml(point)}</li>`).join("")}
                </ul>
              </section>
              <div class="field-note"><span class="field-label">상세 해설</span>${escapeHtml(slide.field)}</div>
              <div class="source">출처/근거: ${escapeHtml(slide.source)}${links.length ? " · " + links.join(" · ") : ""}</div>
            </div>
            <aside class="visual">
              ${renderVisual(slide.visual)}
            </aside>
          </div>`;
        renderTabs();
        fitSlideToFrame();
        if (options.updateHash !== false) {
          history.replaceState(
            null,
            "",
            `${location.href.split("#")[0]}#${String(slide.no).padStart(2, "0")}`
          );
        }
      }

      function fitSlideToFrame() {
        slideEl.classList.remove("overfull", "scroll-safe");
        requestAnimationFrame(() => {
          const overflows = hasOverflow(slideEl) || hasOverflow(slideEl.querySelector(".content"));
          if (!overflows) return;
          slideEl.classList.add("overfull");
          requestAnimationFrame(() => {
            const stillOverflows =
              hasOverflow(slideEl) ||
              hasOverflow(slideEl.querySelector(".content")) ||
              hasOverflow(slideEl.querySelector(".visual"));
            if (stillOverflows) slideEl.classList.add("scroll-safe");
          });
        });
      }

      function hasOverflow(element) {
        return (
          Boolean(element) &&
          (element.scrollHeight > element.clientHeight + 2 ||
            element.scrollWidth > element.clientWidth + 2)
        );
      }

      function goToSlide(no) {
        const index = slides.findIndex((slide) => slide.no === Number(no));
        if (index < 0) return;
        if (activeFilter !== "all" && slides[index].cat !== activeFilter) {
          activeFilter = "all";
          renderFilters();
        }
        activeIndex = index;
        renderSlide();
      }

      function moveSlide(delta) {
        const visible = visibleSlides();
        const currentVisibleIndex = visible.findIndex(
          (slide) => slide.no === slides[activeIndex].no
        );
        const nextSlide = visible[currentVisibleIndex + delta];
        if (!nextSlide) return;
        activeIndex = slides.findIndex((slide) => slide.no === nextSlide.no);
        renderSlide();
      }

      function syncSlideFromHash() {
        const hashNo = Number(location.hash.replace("#", ""));
        if (!Number.isInteger(hashNo) || hashNo < 1 || hashNo > slides.length) return;
        activeIndex = hashNo - 1;
        if (activeFilter !== "all" && slides[activeIndex].cat !== activeFilter) {
          activeFilter = "all";
          renderFilters();
        }
        renderSlide({ updateHash: false });
      }

      categoryFilter.addEventListener("click", (event) => {
        const button = event.target.closest("[data-filter]");
        if (!button) return;
        activeFilter = button.dataset.filter;
        if (activeFilter !== "all") {
          const firstIndex = slides.findIndex((slide) => slide.cat === activeFilter);
          if (firstIndex >= 0) activeIndex = firstIndex;
        }
        renderFilters();
        renderSlide();
      });

      tabGroups.addEventListener("click", (event) => {
        const button = event.target.closest("[data-slide]");
        if (!button) return;
        goToSlide(button.dataset.slide);
      });

      prevBtn.addEventListener("click", () => moveSlide(-1));
      nextBtn.addEventListener("click", () => moveSlide(1));
      document.querySelector("#printBtn").addEventListener("click", () => window.print());
      fullscreenBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.body.classList.add("presentation-mode");
          document.documentElement.requestFullscreen?.().catch(() => {
            document.body.classList.remove("presentation-mode");
          });
        } else {
          document.exitFullscreen?.();
        }
      });
      document.addEventListener("fullscreenchange", () => {
        const enabled = Boolean(document.fullscreenElement);
        document.body.classList.toggle("presentation-mode", enabled);
        fullscreenBtn.textContent = enabled ? "나가기" : "전체화면";
      });
      window.addEventListener("hashchange", syncSlideFromHash);
      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" || event.key === "PageDown") nextBtn.click();
        if (event.key === "ArrowLeft" || event.key === "PageUp") prevBtn.click();
      });

      syncSlideFromHash();
      renderFilters();
      renderSlide({ updateHash: !location.hash });
    </script>
  </body>
</html>
